name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-unit-tests:
    name: engine-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.27"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run engine unit and integration tests
        run: uv run --frozen python -m unittest discover -s tests -v

  engine-lint:
    name: engine-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.27"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run engine lint
        run: uv run --frozen ruff check .

  engine-phase1-acceptance:
    name: engine-phase1-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.27"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run synthetic Phase 1 acceptance
        run: uv run --frozen python scripts/run_phase1_acceptance.py --output "${RUNNER_TEMP}/phase1-acceptance"

  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
      - name: Check pushed diff
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "${BEFORE_SHA}...${HEAD_SHA}"
      - name: Check newly created branch
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: git diff-tree --check --root -r HEAD
      - name: Check manually dispatched revision
        if: github.event_name == 'workflow_dispatch'
        run: git diff --check HEAD^ HEAD
      - name: Validate repository configuration
        run: |
          python -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("pyproject.toml").read_text()); tomllib.loads(pathlib.Path("uv.lock").read_text())'
          test -s .github/CODEOWNERS
          test -s .github/pull_request_template.md
