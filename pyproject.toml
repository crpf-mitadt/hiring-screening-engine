[project]
name = "chandra-ocr-2-eval"
version = "0.1.0"
description = "Evaluation pipeline for Chandra OCR-2 and resume-to-JD matching"
requires-python = ">=3.10,<3.13"

dependencies = [
    "beautifulsoup4==4.15.0",
    "chandra-ocr==0.2.0",
    "huggingface-hub==1.23.0",
    "hf-xet==1.5.1",
    "openai==2.45.0",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pypdfium2==5.11.0",
    "python-docx==1.2.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "ruff==0.17.5",
]

[project.scripts]
chandra-eval = "chandra_eval.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chandra_eval"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
